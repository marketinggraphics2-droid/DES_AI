services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: des
      POSTGRES_PASSWORD: des
      POSTGRES_DB: des
    ports: ["5433:5432"]
    volumes:
      - des-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U des"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://des:des@db:5432/des
    ports: ["8787:8787"]
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ../../1 Assets/Website Scrape 2026-10-01:/kb:ro
    command: sh -c "node scripts/migrate.js && node src/server.js"

volumes:
  des-pg:
